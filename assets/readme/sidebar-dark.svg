<text x="56" y="72" font-size="20" font-weight="600" fill="#e9eaf0">1 · Run</text>
<rect x="56" y="90" width="446" height="160" rx="12" fill="#1d1e23" stroke="#2c2e36"/>
<g id="cmd1"><text x="76" y="132" font-family="&quot;Cascadia Mono&quot;, &quot;SF Mono&quot;, Consolas, ui-monospace, monospace" font-size="17" fill="#e9eaf0"><tspan fill="#7f89ee">$ </tspan>python3 claude_archive.py \</text></g>
<g id="cmd2"><text x="116" y="160" font-family="&quot;Cascadia Mono&quot;, &quot;SF Mono&quot;, Consolas, ui-monospace, monospace" font-size="17" fill="#e9eaf0">--import-claude-ai --write</text></g>
<g id="cmd3"><text x="76" y="198" font-family="&quot;Cascadia Mono&quot;, &quot;SF Mono&quot;, Consolas, ui-monospace, monospace" font-size="17" fill="#e9eaf0"><tspan fill="#7f89ee">$ </tspan>python3 claude_archive.py \</text><text x="116" y="226" font-family="&quot;Cascadia Mono&quot;, &quot;SF Mono&quot;, Consolas, ui-monospace, monospace" font-size="17" fill="#e9eaf0">--register-desktop --write</text></g>
<text x="56" y="306" font-size="20" font-weight="600" fill="#e9eaf0">2 · Reopen the desktop app</text>
<text x="56" y="340" font-size="18" fill="#a7aabb">Old sessions come back, grouped by folder.</text>
<text x="56" y="368" font-size="18" fill="#a7aabb">claude.ai chats get their own group,</text>
<text x="56" y="396" font-size="18" fill="#a7aabb">ready to continue.</text>
