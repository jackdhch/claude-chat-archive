<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif">
<title>Old sessions reappear in the desktop app's Code sidebar</title><desc>Mock-up with made-up titles: after running the register command and reopening the desktop app, old sessions appear grouped by folder</desc>
<rect x="0.5" y="0.5" width="1199" height="519" rx="18" fill="#131417" stroke="#2c2e36"/>
<text x="56" y="70" font-size="15" font-weight="600" fill="#e9eaf0">1 · Run</text>
<rect x="56" y="88" width="430" height="150" rx="12" fill="#1d1e23" stroke="#2c2e36"/>
<g id="cmd1"><text x="78" y="128" font-family="&quot;Cascadia Mono&quot;, &quot;SF Mono&quot;, Consolas, ui-monospace, monospace" font-size="15" fill="#e9eaf0"><tspan fill="#7f89ee">$ </tspan>python3 claude_archive.py \</text></g>
<g id="cmd2"><text x="114" y="154" font-family="&quot;Cascadia Mono&quot;, &quot;SF Mono&quot;, Consolas, ui-monospace, monospace" font-size="15" fill="#e9eaf0">--import-claude-ai --write</text></g>
<g id="cmd3"><text x="78" y="190" font-family="&quot;Cascadia Mono&quot;, &quot;SF Mono&quot;, Consolas, ui-monospace, monospace" font-size="15" fill="#e9eaf0"><tspan fill="#7f89ee">$ </tspan>python3 claude_archive.py \</text><text x="114" y="216" font-family="&quot;Cascadia Mono&quot;, &quot;SF Mono&quot;, Consolas, ui-monospace, monospace" font-size="15" fill="#e9eaf0">--register-desktop --write</text></g>
<text x="56" y="290" font-size="15" font-weight="600" fill="#e9eaf0">2 · Reopen the desktop app</text>
<text x="56" y="318" font-size="14" fill="#a7aabb">Old sessions come back, grouped by folder.</text>
<text x="56" y="342" font-size="14" fill="#a7aabb">claude.ai chats get their own group, ready to continue.</text>
<text x="56" y="468" font-size="12" fill="#7c7f90">Mock-up with made-up titles</text>
