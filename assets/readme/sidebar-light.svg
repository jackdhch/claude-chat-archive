<text x="56" y="72" font-size="20" font-weight="600" fill="#1b1c21">1 · Run</text>
<rect x="56" y="90" width="446" height="160" rx="12" fill="#ffffff" stroke="#e2e3ea"/>
<g id="cmd1"><text x="76" y="132" font-family="&quot;Cascadia Mono&quot;, &quot;SF Mono&quot;, Consolas, ui-monospace, monospace" font-size="17" fill="#1b1c21"><tspan fill="#4b56d2">$ </tspan>python3 claude_archive.py \</text></g>
<g id="cmd2"><text x="116" y="160" font-family="&quot;Cascadia Mono&quot;, &quot;SF Mono&quot;, Consolas, ui-monospace, monospace" font-size="17" fill="#1b1c21">--import-claude-ai --write</text></g>
<g id="cmd3"><text x="76" y="198" font-family="&quot;Cascadia Mono&quot;, &quot;SF Mono&quot;, Consolas, ui-monospace, monospace" font-size="17" fill="#1b1c21"><tspan fill="#4b56d2">$ </tspan>python3 claude_archive.py \</text><text x="116" y="226" font-family="&quot;Cascadia Mono&quot;, &quot;SF Mono&quot;, Consolas, ui-monospace, monospace" font-size="17" fill="#1b1c21">--register-desktop --write</text></g>
<text x="56" y="306" font-size="20" font-weight="600" fill="#1b1c21">2 · Reopen the desktop app</text>
<text x="56" y="340" font-size="18" fill="#55586a">Old sessions come back, grouped by folder.</text>
<text x="56" y="368" font-size="18" fill="#55586a">claude.ai chats get their own group,</text>
<text x="56" y="396" font-size="18" fill="#55586a">ready to continue.</text>
